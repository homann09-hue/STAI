name: StockPilot Manual Vercel Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      production_confirmation:
        description: Type DEPLOY STOCKPILOT PRODUCTION when target is production
        required: false
        type: string

concurrency:
  group: stockpilot-vercel-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Manual Vercel deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: stockpilot-${{ github.event.inputs.target }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ secrets.STOCKPILOT_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.STOCKPILOT_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.STOCKPILOT_VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.STOCKPILOT_VERCEL_CLI_VERSION || '59.1.3' }}
    steps:
      - name: Verify required StockPilot Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment secret::$name is not configured for the selected GitHub environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout StockPilot AI only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format hygiene
        run: npm run format:check

      - name: Require explicit production confirmation
        if: ${{ github.event.inputs.target == 'production' }}
        env:
          PRODUCTION_CONFIRMATION: ${{ github.event.inputs.production_confirmation }}
        run: |
          if [ "$PRODUCTION_CONFIRMATION" != "DEPLOY STOCKPILOT PRODUCTION" ]; then
            echo "Production deploy blocked: confirmation phrase mismatch." >&2
            exit 1
          fi

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: German wording and legal language audit
        run: npm run qa:grammar

      - name: Safe dependency audit
        run: npm run audit:safe

      - name: Institutional static controls
        run: npm run enterprise:check -- --local-only

      - name: Generate deployment evidence and SBOM
        run: npm run evidence:generate

      - name: Production build for browser gate
        run: npm run build

      - name: JavaScript performance budget
        run: npm run performance:budget

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E smoke gate
        run: npm run test:e2e

      - name: Install Vercel CLI
        run: npm install --global vercel@"$VERCEL_CLI_VERSION"

      - name: Pull Vercel environment
        run: |
          if [ "${{ github.event.inputs.target }}" = "production" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Verify exact StockPilot project binding
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const binding = JSON.parse(fs.readFileSync(".vercel/project.json", "utf8"));
          const expectedProject = process.env.VERCEL_PROJECT_ID;
          const expectedOrg = process.env.VERCEL_ORG_ID;

          if (binding.projectId !== expectedProject || binding.orgId !== expectedOrg) {
            console.error("StockPilot deployment blocked: Vercel project binding mismatch.");
            process.exit(1);
          }
          NODE

      - name: Build Vercel artifact
        run: |
          if [ "${{ github.event.inputs.target }}" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy preview artifact
        id: deploy-preview
        if: ${{ github.event.inputs.target == 'preview' }}
        run: echo "url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

      - name: Deploy production artifact
        id: deploy-production
        if: ${{ github.event.inputs.target == 'production' }}
        run: echo "url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

      - name: Verify deployed StockPilot identity
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.url }}
          PRODUCTION_URL: ${{ steps.deploy-production.outputs.url }}
          DEPLOY_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "$DEPLOY_TARGET" = "production" ]; then
            DEPLOY_URL="$PRODUCTION_URL"
          else
            DEPLOY_URL="$PREVIEW_URL"
          fi

          vercel inspect "$DEPLOY_URL" --json --token="$VERCEL_TOKEN" > /tmp/stockpilot-deployment.json
          node <<'NODE'
          const fs = require("node:fs");
          const deployment = JSON.parse(fs.readFileSync("/tmp/stockpilot-deployment.json", "utf8"));
          const expectedTarget = process.env.DEPLOY_TARGET;

          if (deployment.name !== "stockpilot-ai") {
            console.error("Deployment blocked: target project is not stockpilot-ai.");
            process.exit(1);
          }
          if (expectedTarget === "production" && deployment.target !== "production") {
            console.error("Deployment blocked: production target was not created.");
            process.exit(1);
          }
          NODE

      - name: Deployment summary
        run: |
          if [ "${{ github.event.inputs.target }}" = "production" ]; then
            DEPLOY_URL="${{ steps.deploy-production.outputs.url }}"
          else
            DEPLOY_URL="${{ steps.deploy-preview.outputs.url }}"
          fi

          {
            echo "### StockPilot Vercel deployment"
            echo ""
            echo "- Target: ${{ github.event.inputs.target }}"
            echo "- URL: $DEPLOY_URL"
            echo "- Vercel CLI: $VERCEL_CLI_VERSION"
            echo "- QA gates: typecheck, lint, coverage, grammar, audit, Vercel build"
          } >> "$GITHUB_STEP_SUMMARY"
