name: StockPilot Red Team

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: stockpilot-redteam-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  redteam:
    name: Full red-team QA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      STOCKPILOT_MARKET_PROVIDER: mock
      STOCKPILOT_NEWS_PROVIDER: mock
      STOCKPILOT_FUNDAMENTALS_PROVIDER: mock
      STOCKPILOT_AI_PROVIDER: mock
    steps:
      - name: Checkout StockPilot AI only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run full red-team suite
        run: npm run qa:redteam
