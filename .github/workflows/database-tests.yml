name: Database Tests

# Auch bei Push: ein direkter Commit auf main wuerde sonst an den
# Datenbankkontrollen vorbeilaufen.
on:
  push:
  pull_request:
  workflow_dispatch:

# Der Gruppenschluessel nutzt bewusst `ref_name` bzw. den Head-Branch des Pull
# Requests statt `github.ref`. Beide Ereignisse -- Push und
# `pull_request: synchronize` -- ergeben damit denselben Schluessel, und der
# zweite Lauf bricht den ersten ab. Ohne diese Normalisierung liefe jeder Push
# mit offenem Pull Request doppelt: einmal fuer den Push, einmal fuer den PR.
concurrency:
  group: stockpilot-db-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.109.1
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Reset schema from migrations
        run: supabase db reset --local --no-seed
      - name: Run RLS and integrity tests
        run: supabase test db
