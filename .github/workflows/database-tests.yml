name: Database Tests

# Pull Requests werden vor dem Merge geprueft, main nach jedem Push. Damit gibt
# es pro Commit nur einen Pflichtcheck statt eines spaeter abgebrochenen
# Push-Duplikats mit demselben Namen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: stockpilot-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.109.1
      - name: Start isolated Supabase stack
        # pgTAP braucht nur Datenbank, Auth-Gateway und PostgREST. Mailpit
        # belegte auf einem frischen GitHub-Runner bereits Port 54324 und liess
        # den Lauf vor der ersten Assertion scheitern. Nicht benoetigte Dienste
        # werden deshalb gar nicht erst gestartet.
        run: >-
          supabase start
          --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector
      - name: Reset schema from migrations
        run: supabase db reset --local --no-seed
      - name: Run RLS and integrity tests
        run: supabase test db
      - name: Run atomic billing concurrency test
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:billing:concurrency
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup || true
