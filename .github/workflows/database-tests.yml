name: Database Tests

# Auch bei Push: ein direkter Commit auf main wuerde sonst an den
# Datenbankkontrollen vorbeilaufen.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stockpilot-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Reset schema from migrations
        run: supabase db reset --local --no-seed
      - name: Run RLS and integrity tests
        run: supabase test db
