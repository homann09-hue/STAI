name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: stockpilot-vercel-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  preview:
    name: Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STOCKPILOT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verify native StockPilot preview
        shell: bash
        run: |
          set -euo pipefail

          preview_url=""
          for attempt in $(seq 1 40); do
            deployment_id="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/deployments" \
                -f sha="$STOCKPILOT_COMMIT_SHA" -f per_page=20 \
                --jq 'map(select(.environment == "Preview" and .production_environment == false))[0].id // empty'
            )"

            if [[ -n "$deployment_id" ]]; then
              preview_url="$(
                gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                  --jq 'map(select(.state == "success" and .environment_url != null))[0].environment_url // empty'
              )"
              [[ -n "$preview_url" ]] && break

              failed_state="$(
                gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                  --jq 'map(select(.state == "failure" or .state == "error"))[0].state // empty'
              )"
              if [[ -n "$failed_state" ]]; then
                echo "Native StockPilot preview failed with state: $failed_state" >&2
                exit 1
              fi
            fi

            sleep 15
          done

          [[ -n "$preview_url" ]] || { echo "Timed out waiting for native StockPilot preview" >&2; exit 1; }
          node -e '
            const url = new URL(process.argv[1]);
            if (url.protocol !== "https:" || !/^stockpilot-[a-z0-9-]+-bau-pro\.vercel\.app$/.test(url.hostname) || url.pathname !== "/") {
              process.exit(1);
            }
          ' "$preview_url"
          health_file="$(mktemp)"
          trap 'rm -f "$health_file"' EXIT
          health_status="$(
            curl --silent --show-error --max-time 20 \
              --output "$health_file" --write-out '%{http_code}' \
              "$preview_url/api/health"
          )"

          if [[ "$health_status" == "200" ]]; then
            node -e '
              const payload = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              if (payload.status !== "ok") process.exit(1);
            ' "$health_file"
            health_evidence="ok"
          elif [[ "$health_status" =~ ^30[1278]$ ]] && grep -q '^Redirecting' "$health_file"; then
            health_evidence="blocked by Vercel Deployment Protection (HTTP $health_status)"
          else
            echo "Unexpected preview health response: HTTP $health_status" >&2
            exit 1
          fi

          printf '### StockPilot Preview\n\n- %s\n- Native deployment: success\n- Runtime health: %s\n' \
            "$preview_url" "$health_evidence" >> "$GITHUB_STEP_SUMMARY"
